name: "[cargo] Format & Lint"

on:
  workflow_call:

env:
  JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
  ARGON2_SECRET_KEY: ${{ secrets.ARGON2_SECRET_KEY }}

  SURREALDB_ADDRESS: ${{ secrets.SURREALDB_ADDRESS }}
  SURREALDB_NAMESPACE: ${{ secrets.SURREALDB_NAMESPACE }}
  SURREALDB_DATABASE: ${{ secrets.SURREALDB_DATABASE }}

  SURREALDB_HOSTNAME: ${{ secrets.SURREALDB_HOSTNAME }}
  SURREALDB_INSTANCE_ID: ${{ secrets.SURREALDB_INSTANCE_ID }}
  SURREALDB_AUTH_TOKEN: ${{ secrets.SURREALDB_AUTH_TOKEN }}

jobs:
  cargo-format:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        channel:
          - nightly

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
          components: rustfmt

      - run: cargo fmt --all -- --check

  cargo-lint:
    needs:
      - cargo-format

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        channel:
          - nightly

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.channel }}
          components: clippy

      - run: cargo clippy --workspace --all-targets
