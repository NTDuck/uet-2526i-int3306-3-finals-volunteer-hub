[package]
name = "use-cases"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
wasm-bindings = ["dep:tsify", "dep:wasm-bindgen"]

[dependencies]
axiom = { path = "../../axiom" }
domain = { path = "../domain" }

async-trait = { workspace = true }
bon = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, optional = true }
strum = { workspace = true }
thiserror = { workspace = true }
tsify = { version = "0.5.5", features = ["js"], default-features = false, optional = true }
tracing = { workspace = true }
vec1 = { workspace = true }
wasm-bindgen = { version = "=0.2.102", optional = true }  # jsr:@deno/wasmbuild@0.19.3

[lints]
workspace = true
